# Every AI service call goes to FakeOpenAiResource in this same app: no API key, no network, no containers
quarkus.langchain4j.openai.api-key=not-used
quarkus.langchain4j.openai.base-url=http://localhost:${quarkus.http.test-port:8081}/fake-openai/v1
quarkus.langchain4j.openai.timeout=10s

# Trace everything, export to the in-memory exporter in the tests (InMemorySpanExporter), nothing over OTLP
quarkus.otel.traces.sampler=always_on
quarkus.otel.exporter.otlp.enabled=false
quarkus.otel.bsp.schedule.delay=100
